name: SpringBoot CI

on:
  push:
    branches:
      - main

permissions: 
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Add permission
        run: chmod +x ./mvnw
       
      - name: Build Application
        run: ./mvnw clean package
          
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ghcr.io/kamila630/ci-cd:latest .

      - name: Push Docker Image to GHCR
        run: docker push ghcr.io/kamila630/ci-cd:latest
