name: SpringBoot CI
on:
    push:
        branches:
          - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - name : Checkout code
            uses: actions/checkout@v4

          - name: Setup Java
            uses: actions/setup-java@v4
            with:
              java-version: '17'
              distribution: 'temurin'
          - name: Add permission
            run: chmod +x ./mvnw
          - name: Build Application
            run: ./mvnw clean package
          
          - name: Build Docker Image
            run: docker build -t ci-id .
            
